name: coutelya
description: COUTELYA - application mobile de gestion d'atelier de couture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  sqflite: 2.4.3
  path: 1.9.1
  uuid: 4.6.0
  supabase_flutter: 2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/coutelya_logo.png
    - assets/brand/coutelya_mark.png
