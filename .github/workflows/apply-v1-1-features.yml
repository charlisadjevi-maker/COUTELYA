name: Apply COUTELYA V1.1 features

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Database: v2 -> v3 with local workshop settings.
          replace('lib/core/local_database.dart',
                  '      version: 2,',
                  '      version: 3,')
          replace('lib/core/local_database.dart',
                  "    await db.execute('CREATE INDEX idx_payments_order ON payments(order_id)');\n  }",
                  "    await db.execute('CREATE INDEX idx_payments_order ON payments(order_id)');\n    await db.execute('CREATE TABLE workshop_settings (key TEXT PRIMARY KEY, value TEXT NOT NULL, updated_at TEXT NOT NULL)');\n    await db.insert('workshop_settings', {'key': 'name', 'value': 'Atelier Élégance', 'updated_at': DateTime.now().toIso8601String()});\n  }")
          replace('lib/core/local_database.dart',
                  "    if (oldVersion < 2) {",
                  "    if (oldVersion < 2) {")
          replace('lib/core/local_database.dart',
                  "    }\n  }\n\n  Future<void> _try(Database db, String sql) async {",
                  "    }\n    if (oldVersion < 3) {\n      await _try(db, \"CREATE TABLE workshop_settings (key TEXT PRIMARY KEY, value TEXT NOT NULL, updated_at TEXT NOT NULL)\");\n      await _try(db, \"INSERT INTO workshop_settings (key, value, updated_at) VALUES ('name', 'Atelier Élégance', '${DateTime.now().toIso8601String()}')\");\n    }\n  }\n\n  Future<void> _try(Database db, String sql) async {")

          # Repository for the workshop name.
          p = Path('lib/repositories.dart')
          s = p.read_text(encoding='utf-8')
          marker = 'class ClientRepository {'
          addition = '''class WorkshopRepository {\n  final dbProvider = LocalDatabase.instance;\n\n  Future<String> getName() async {\n    final db = await dbProvider.database;\n    final rows = await db.query('workshop_settings', where: 'key = ?', whereArgs: ['name'], limit: 1);\n    if (rows.isEmpty) return 'Atelier Élégance';\n    final value = (rows.first['value'] as String?)?.trim();\n    return value == null || value.isEmpty ? 'Atelier Élégance' : value;\n  }\n\n  Future<void> saveName(String name) async {\n    final value = name.trim().isEmpty ? 'Atelier Élégance' : name.trim();\n    final db = await dbProvider.database;\n    await db.insert('workshop_settings', {\n      'key': 'name',\n      'value': value,\n      'updated_at': DateTime.now().toIso8601String(),\n    }, conflictAlgorithm: ConflictAlgorithm.replace);\n  }\n}\n\n'''
          if addition not in s:
              s = s.replace(marker, addition + marker, 1)
              p.write_text(s, encoding='utf-8')

          # Dashboard: display the saved workshop name.
          replace('lib/screens/dashboard_screen.dart',
                  "  final expenseRepo = ExpenseRepository();\n  late Future<DashboardStats> stats = repo.stats();",
                  "  final expenseRepo = ExpenseRepository();\n  final workshopRepo = WorkshopRepository();\n  late Future<DashboardStats> stats = repo.stats();\n  late Future<String> workshopName = workshopRepo.getName();")
          replace('lib/screens/dashboard_screen.dart',
                  "  void reload() => setState(() { stats = repo.stats(); expenses = expenseRepo.total(); });",
                  "  void reload() => setState(() { stats = repo.stats(); expenses = expenseRepo.total(); workshopName = workshopRepo.getName(); });")
          replace('lib/screens/dashboard_screen.dart',
                  "              Row(children: [\n                const Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [Text('Bonjour 👋', style: TextStyle(color: CoutelyaColors.muted, fontWeight: FontWeight.w700)), SizedBox(height: 4), Text('Atelier Élégance', style: TextStyle(fontSize: 23, fontWeight: FontWeight.w900))])),\n                Container(width: 42, height: 42, decoration: const BoxDecoration(color: CoutelyaColors.purpleSoft, shape: BoxShape.circle), child: const Icon(Icons.notifications_none_rounded, color: CoutelyaColors.purple)),\n              ]),",
                  "              FutureBuilder<String>(\n                future: workshopName,\n                builder: (context, snapshot) => Row(children: [\n                  Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text('Bonjour 👋', style: TextStyle(color: CoutelyaColors.muted, fontWeight: FontWeight.w700)), const SizedBox(height: 4), Text(snapshot.data ?? 'Atelier Élégance', style: const TextStyle(fontSize: 23, fontWeight: FontWeight.w900))])),\n                  Container(width: 42, height: 42, decoration: const BoxDecoration(color: CoutelyaColors.purpleSoft, shape: BoxShape.circle), child: const Icon(Icons.notifications_none_rounded, color: CoutelyaColors.purple)),\n                ]),\n              ),")

          # Workshop profile: editable persisted name.
          replace('lib/screens/more_screens.dart',
                  "class WorkshopProfileScreen extends StatelessWidget {\n  const WorkshopProfileScreen({super.key});",
                  "class WorkshopProfileScreen extends StatefulWidget {\n  const WorkshopProfileScreen({super.key});\n\n  @override\n  State<WorkshopProfileScreen> createState() => _WorkshopProfileScreenState();\n}\n\nclass _WorkshopProfileScreenState extends State<WorkshopProfileScreen> {\n  final repo = WorkshopRepository();\n  final nameController = TextEditingController();\n  bool loading = true;\n  bool saving = false;\n\n  @override\n  void initState() {\n    super.initState();\n    _load();\n  }\n\n  Future<void> _load() async {\n    nameController.text = await repo.getName();\n    if (mounted) setState(() => loading = false);\n  }\n\n  @override\n  void dispose() {\n    nameController.dispose();\n    super.dispose();\n  }\n\n  Future<void> _save() async {\n    setState(() => saving = true);\n    await repo.saveName(nameController.text);\n    if (!mounted) return;\n    setState(() => saving = false);\n    ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Nom de l’atelier enregistré.')));\n  }")
          replace('lib/screens/more_screens.dart',
                  "  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('Profil de l’atelier')),\n      body: ListView(\n        padding: const EdgeInsets.all(18),\n        children: [\n          const Center(child: CircleAvatar(radius: 45, backgroundColor: CoutelyaColors.purpleSoft, child: Icon(Icons.storefront_rounded, color: CoutelyaColors.purple, size: 38))),\n          const SizedBox(height: 18),\n          const Center(child: Text('Atelier Élégance', style: TextStyle(fontSize: 21, fontWeight: FontWeight.w900))),\n          const SizedBox(height: 22),\n          const Card(child: Column(children: [ListTile(title: Text('Propriétaire'), subtitle: Text('Marie K.')), Divider(height: 1), ListTile(title: Text('Téléphone'), subtitle: Text('+229 97 12 34 56')), Divider(height: 1), ListTile(title: Text('Adresse'), subtitle: Text('Lokossa, Bénin')), Divider(height: 1), ListTile(title: Text('Offre actuelle'), subtitle: Text('COUTELYA Pro'))])),\n          const SizedBox(height: 16),\n          FilledButton.icon(onPressed: () {}, icon: const Icon(Icons.edit_outlined), label: const Text('Modifier le profil')),\n        ],\n      ),\n    );\n  }\n}\n\nclass SettingsScreen",
                  "  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('Profil de l’atelier')),\n      body: loading\n          ? const Center(child: CircularProgressIndicator())\n          : ListView(\n              padding: const EdgeInsets.all(18),\n              children: [\n                const Center(child: CircleAvatar(radius: 45, backgroundColor: CoutelyaColors.purpleSoft, child: Icon(Icons.storefront_rounded, color: CoutelyaColors.purple, size: 38))),\n                const SizedBox(height: 18),\n                const Center(child: Text('Identité de l’atelier', style: TextStyle(fontSize: 19, fontWeight: FontWeight.w900))),\n                const SizedBox(height: 22),\n                TextField(controller: nameController, textInputAction: TextInputAction.done, decoration: const InputDecoration(labelText: 'Nom de l’atelier', prefixIcon: Icon(Icons.storefront_outlined), helperText: 'Ce nom sera affiché sur le tableau de bord.')),\n                const SizedBox(height: 16),\n                const Card(child: Column(children: [ListTile(title: Text('Propriétaire'), subtitle: Text('Marie K.')), Divider(height: 1), ListTile(title: Text('Téléphone'), subtitle: Text('+229 97 12 34 56')), Divider(height: 1), ListTile(title: Text('Adresse'), subtitle: Text('Lokossa, Bénin')), Divider(height: 1), ListTile(title: Text('Offre actuelle'), subtitle: Text('COUTELYA Pro'))])),\n                const SizedBox(height: 16),\n                FilledButton.icon(onPressed: saving ? null : _save, icon: const Icon(Icons.save_outlined), label: Text(saving ? 'Enregistrement...' : 'Enregistrer le nom')),\n              ],\n            ),\n    );\n  }\n}\n\nclass SettingsScreen")

          # Orders: sold button records the remaining balance as a payment.
          replace('lib/screens/orders_screens.dart',
                  "  void reload() => setState(() => order = orderRepo.getById(widget.orderId));\n\n  @override",
                  "  void reload() => setState(() => order = orderRepo.getById(widget.orderId));\n\n  Future<void> _markAsPaid(CoutureOrder o, double balance) async {\n    if (balance <= 0) return;\n    final confirm = await showDialog<bool>(\n      context: context,\n      builder: (context) => AlertDialog(\n        title: const Text('Marquer la commande comme soldée ?'),\n        content: Text('Le solde de ${formatMoney(balance)} sera enregistré comme paiement en espèces.'),\n        actions: [\n          TextButton(onPressed: () => Navigator.pop(context, false), child: const Text('Annuler')),\n          FilledButton(onPressed: () => Navigator.pop(context, true), child: const Text('Confirmer')),\n        ],\n      ),\n    );\n    if (confirm != true) return;\n    await paymentRepo.add(orderId: o.id, amount: balance, method: 'cash', note: 'Solde enregistré via le bouton Soldé');\n    if (mounted) {\n      reload();\n      ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('Commande soldée.')));\n    }\n  }\n\n  @override")
          replace('lib/screens/orders_screens.dart',
                  "                      const SizedBox(height: 18),\n                      FilledButton.icon(\n                        onPressed: () async {\n                          await Navigator.of(context).push(MaterialPageRoute(builder: (_) => ProductionTrackingScreen(order: o)));",
                  "                      const SizedBox(height: 18),\n                      if (balance > 0) ...[\n                        FilledButton.icon(\n                          onPressed: () => _markAsPaid(o, balance),\n                          icon: const Icon(Icons.check_circle_outline_rounded),\n                          label: const Text('Soldé'),\n                          style: FilledButton.styleFrom(backgroundColor: CoutelyaColors.green, minimumSize: const Size.fromHeight(48), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12))),\n                        ),\n                        const SizedBox(height: 10),\n                      ] else\n                        Container(\n                          width: double.infinity,\n                          padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),\n                          decoration: BoxDecoration(color: CoutelyaColors.green.withValues(alpha: 0.10), borderRadius: BorderRadius.circular(12), border: Border.all(color: CoutelyaColors.green.withValues(alpha: 0.25))),\n                          child: const Row(children: [Icon(Icons.check_circle_rounded, color: CoutelyaColors.green), SizedBox(width: 9), Text('Commande soldée', style: TextStyle(fontWeight: FontWeight.w900, color: CoutelyaColors.green))]),\n                        ),\n                      const SizedBox(height: 10),\n                      FilledButton.icon(\n                        onPressed: () async {\n                          await Navigator.of(context).push(MaterialPageRoute(builder: (_) => ProductionTrackingScreen(order: o)));" )

          # Client interface already supports preselectedClientId; make the action explicit in the client Orders tab too.
          replace('lib/screens/clients_screens.dart',
                  "          if (rows.isEmpty) return const EmptyState(icon: Icons.receipt_long_outlined, title: 'Aucune commande', subtitle: 'Les commandes de ce client apparaîtront ici.');\n          return ListView.separated(",
                  "          if (rows.isEmpty) return ListView(padding: const EdgeInsets.all(18), children: [const EmptyState(icon: Icons.receipt_long_outlined, title: 'Aucune commande', subtitle: 'Les commandes de ce client apparaîtront ici.'), const SizedBox(height: 16), FilledButton.icon(onPressed: () async { final ok = await Navigator.of(context).push<bool>(MaterialPageRoute(builder: (_) => NewOrderScreen(preselectedClientId: c.id))); if (ok == true && mounted) setState(() {}); }, icon: const Icon(Icons.add_rounded), label: const Text('Créer une commande pour ce client'))]);\n          return ListView.separated(")

          # Remove this one-shot workflow after applying the changes.
          Path('.github/workflows/apply-v1-1-features.yml').unlink()
          PY

      - name: Verify changes
        run: |
          grep -q "version: 3" lib/core/local_database.dart
          grep -q "Soldé" lib/screens/orders_screens.dart
          grep -q "Nom de l’atelier" lib/screens/more_screens.dart
          grep -q "preselectedClientId" lib/screens/clients_screens.dart

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply-v1-1-features.yml
          git commit -m "feat: sold orders and editable workshop name"
          git push